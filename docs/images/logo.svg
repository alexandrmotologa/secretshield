<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="core-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>

    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f5ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 508)" filter="url(#subtle-shadow)">

      <!-- Massive Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- High-Precision Telemetry Dotted Perimeter -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- MASCOT: THE AEGIS PANGOLIN (Zero-Trust Living Armor & Vault Guardian) -->

      <!-- Outer Carapace Armor Wings / Flanks (Back Layer) -->
      <!-- Left outer armor dorsal plate -->
      <polygon points="-120,-270 -200,-280 -270,-150 -200,-100 -120,-170" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <!-- Right outer armor dorsal plate -->
      <polygon points="120,-270 200,-280 270,-150 200,-100 120,-170" fill="#1e293b" stroke="#334155" stroke-width="2" />

      <!-- Secondary Mid Flank Plates -->
      <polygon points="-200,-100 -280,-40 -260,110 -170,90 -150,-10" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
      <polygon points="200,-100 280,-40 260,110 170,90 150,-10" fill="#1e293b" stroke="#334155" stroke-width="2" />

      <!-- Lower Shell Flank Plates -->
      <polygon points="-170,90 -230,160 -190,270 -100,240 -110,140" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="170,90 230,160 190,270 100,240 110,140" fill="#334155" stroke="#475569" stroke-width="2" />

      <!-- Lower Base Shield Point (Tail / Base Carapace) -->
      <polygon points="0,325 -70,250 0,190" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,325 70,250 0,190" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <polygon points="-70,250 -100,240 -60,160 0,190" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="70,250 100,240 60,160 0,190" fill="#334155" stroke="#475569" stroke-width="2" />

      <!-- Central Shield Breastplate / Keratin Scales Matrix -->
      <!-- Mid-lower scales -->
      <polygon points="0,190 -80,120 0,50" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,190 80,120 0,50" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <!-- Mid-upper scales -->
      <polygon points="0,50 -95,-20 0,-90" fill="#334155" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,50 95,-20 0,-90" fill="#475569" stroke="#1e293b" stroke-width="2" />

      <!-- Side chest support facets -->
      <polygon points="-80,120 -150,-10 -95,-20" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="80,120 150,-10 95,-20" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <polygon points="-80,120 -160,80 -110,140 0,190" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="80,120 160,80 110,140 0,190" fill="#1e293b" stroke="#334155" stroke-width="2" />

      <!-- Pangolin Neck Crest & Hood (Erected Defense Plates) -->
      <polygon points="0,-90 -95,-20 -120,-120 0,-150" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-90 95,-20 120,-120 0,-150" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <polygon points="0,-150 -120,-120 -140,-200 0,-210" fill="#334155" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,-150 120,-120 140,-200 0,-210" fill="#475569" stroke="#1e293b" stroke-width="2" />

      <!-- Pangolin Head / Crown / Snout -->
      <!-- Crown plate -->
      <polygon points="0,-210 -75,-250 0,-300" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-210 75,-250 0,-300" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <!-- Ear / Armor Horn Spikes -->
      <polygon points="-75,-250 -120,-315 -95,-230" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <polygon points="75,-250 120,-315 95,-230" fill="#1e293b" stroke="#334155" stroke-width="2" />

      <!-- Brow & Snout Facets -->
      <polygon points="0,-210 -55,-190 0,-140" fill="#334155" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,-210 55,-190 0,-140" fill="#475569" stroke="#1e293b" stroke-width="2" />

      <polygon points="-55,-190 -75,-250 -95,-230 -85,-180" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="55,-190 75,-250 95,-230 85,-180" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <!-- Tapered Protective Nose Cone -->
      <polygon points="0,-140 -32,-145 0,-115" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
      <polygon points="0,-140 32,-145 0,-115" fill="#334155" stroke="#1e293b" stroke-width="2" />

      <!-- Glowing Cyan Optics (Vigilant Zero-Trust Eyes) -->
      <polygon points="-48,-182 -78,-188 -66,-174" fill="url(#cyan-glow)" filter="url(#core-glow)" />
      <polygon points="48,-182 78,-188 66,-174" fill="url(#cyan-glow)" filter="url(#core-glow)" />
      <polygon points="-52,-180 -64,-183 -60,-177" fill="#ffffff" />
      <polygon points="52,-180 64,-183 60,-177" fill="#ffffff" />

      <!-- Dynamic Credential Vault Heart (Token Broker Core Emblem) -->
      <!-- Outer diamond vault chamber -->
      <polygon points="0,-35 48,15 0,65 -48,15" fill="#0b0f19" stroke="#00f5ff" stroke-width="3" />
      <!-- Inner glowing token gem -->
      <polygon points="0,-20 30,15 0,50 -30,15" fill="url(#cyan-glow)" opacity="0.9" filter="url(#core-glow)" />
      <polygon points="0,-5 12,15 0,35 -12,15" fill="#ffffff" opacity="0.9" />

      <!-- Minimalist Precision Keyway / Broker Slot -->
      <line x1="0" y1="65" x2="0" y2="120" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <circle cx="0" cy="135" r="7" fill="#00f5ff" filter="url(#core-glow)" />

    </g>
  </g>
</svg>