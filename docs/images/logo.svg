<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-tortoise">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="t-obsidian-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="t-obsidian-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="t-obsidian-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Electric Purple to Cyan Security Stream -->
    <linearGradient id="t-purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <linearGradient id="t-cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="t-purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <filter id="t-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#070a12" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-tortoise)">
    <g transform="translate(512, 512)" filter="url(#t-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Perimeter Telemetry Ring -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#a855f7" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- ============================================================== -->
      <!-- TORTOISE LIMBS (Outriggers: Left & Right)                       -->
      <!-- ============================================================== -->
      <!-- Front Left Flipper / Armored Leg -->
      <polygon points="-120,-130 -290,-160 -310,-80 -180,-30" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <polygon points="-290,-160 -310,-80 -230,-70" fill="url(#t-purple-cyan)" opacity="0.9" />

      <!-- Front Right Flipper / Armored Leg -->
      <polygon points="120,-130 290,-160 310,-80 180,-30" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />
      <polygon points="290,-160 310,-80 230,-70" fill="url(#t-purple-cyan)" opacity="0.9" />

      <!-- Rear Left Armored Foot -->
      <polygon points="-140,160 -240,240 -190,290 -100,200" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <!-- Rear Right Armored Foot -->
      <polygon points="140,160 240,240 190,290 100,200" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- Tail (Bottom Center Armor Spike) -->
      <polygon points="0,330 -30,220 0,190" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,330 30,220 0,190" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- ============================================================== -->
      <!-- TORTOISE HEAD & NECK (Alert, Wise, Unmistakable)               -->
      <!-- ============================================================== -->
      <!-- Neck Base -->
      <polygon points="-45,-150 -55,-230 0,-260" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <polygon points="45,-150 55,-230 0,-260" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- Armored Head (Crown & Snout) -->
      <polygon points="0,-335 -50,-260 0,-240" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />
      <polygon points="0,-335 50,-260 0,-240" fill="url(#t-obsidian-light)" stroke="#475569" stroke-width="2" />

      <!-- Jaw & Cheeks -->
      <polygon points="-50,-260 -55,-230 0,-215" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <polygon points="50,-260 55,-230 0,-215" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- Piercing Cyan Eyes -->
      <polygon points="-28,-285 -42,-275 -24,-268" fill="url(#t-cyan-glow)" />
      <circle cx="-31" cy="-277" r="2" fill="#ffffff" />
      <polygon points="28,-285 42,-275 24,-268" fill="url(#t-cyan-glow)" />
      <circle cx="31" cy="-277" r="2" fill="#ffffff" />

      <!-- ============================================================== -->
      <!-- THE MASSIVE CARAPACE SHIELD (The Cryptographic Vault Matrix)    -->
      <!-- Symmetrical, multi-faceted carapace forming a knight's shield  -->
      <!-- ============================================================== -->
      <!-- Outer Shell Rim Border (Dark Steel Carapace) -->
      <path d="
        M 0,-175
        L 165,-125
        L 210,50
        L 155,200
        L 0,265
        L -155,200
        L -210,50
        L -165,-125
        Z
      " fill="none" stroke="#0f172a" stroke-width="20" stroke-linejoin="round" />

      <!-- Outer Carapace Rim Facets -->
      <!-- Top Left -->
      <polygon points="0,-170 -160,-120 -115,-40 0,-70" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <!-- Top Right -->
      <polygon points="0,-170 160,-120 115,-40 0,-70" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- Mid Flank Left (Electric Cyan Inset) -->
      <polygon points="-160,-120 -205,45 -140,80 -115,-40" fill="url(#t-cyan-glow)" stroke="#0284c7" stroke-width="2" />
      <!-- Mid Flank Right (Electric Purple Inset) -->
      <polygon points="160,-120 205,45 140,80 115,-40" fill="url(#t-purple-glow)" stroke="#7e22ce" stroke-width="2" />

      <!-- Lower Flank Left -->
      <polygon points="-205,45 -150,195 -80,140 -140,80" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <!-- Lower Flank Right -->
      <polygon points="205,45 150,195 80,140 140,80" fill="url(#t-obsidian-light)" stroke="#475569" stroke-width="2" />

      <!-- Bottom Point Scutes -->
      <polygon points="0,260 -150,195 -80,140 0,165" fill="url(#t-obsidian-dark)" stroke="#1e293b" stroke-width="2" />
      <polygon points="0,260 150,195 80,140 0,165" fill="url(#t-obsidian-mid)" stroke="#334155" stroke-width="2" />

      <!-- CENTRAL VAULT CORE (The Encrypted Chamber) -->
      <!-- Central Hexagonal Vault Diamond -->
      <polygon points="0,-70 115,-40 140,80 0,165 -140,80 -115,-40" fill="#070a12" stroke="#a855f7" stroke-width="5" />

      <!-- Inner White Keyhole Vault Seal -->
      <polygon points="0,-45 80,-20 95,65 0,125 -95,65 -80,-20" fill="url(#t-obsidian-dark)" stroke="#00f5ff" stroke-width="3" />

      <circle cx="0" cy="15" r="32" fill="#ffffff" />
      <polygon points="-10,20 10,20 14,55 -14,55" fill="#ffffff" />

      <!-- Keyway Center Symbol -->
      <circle cx="0" cy="15" r="14" fill="#0f172a" />
      <polygon points="-4,18 4,18 7,45 -7,45" fill="#0f172a" />

      <!-- Glowing Cyan Dot in Keyway -->
      <circle cx="0" cy="15" r="6" fill="url(#t-cyan-glow)" />

    </g>
  </g>
</svg>