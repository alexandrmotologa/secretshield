[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretshield"
version = "0.1.0"
description = "Zero-Trust credential proxy and dynamic token broker for microservices"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@users.noreply.github.com" }
]
keywords = [
    "security",
    "zero-trust",
    "credentials",
    "proxy",
    "api-gateway",
    "token-broker",
    "audit-trail"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[project.scripts]
secretshield = "secretshield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/secretshield"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
